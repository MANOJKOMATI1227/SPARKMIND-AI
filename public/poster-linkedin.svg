<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#07090e" />
      <stop offset="50%" stopColor="#111320" />
      <stop offset="100%" stopColor="#05070a" />
    </linearGradient>

    <!-- Neon Gold Gradient -->
    <linearGradient id="goldLi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#fbbf24" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="liGlow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#fbbf24" stopOpacity="0.2" />
      <stop offset="60%" stopColor="#ea580c" stopOpacity="0.06" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridLi" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.035)" strokeWidth="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(245, 158, 11, 0.15)" />
    </pattern>

    <!-- Glass Fill -->
    <linearGradient id="glassLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stopColor="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="shadowLi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="rgba(0,0,0,0.5)" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgLi)" />
  <rect width="1200" height="675" fill="url(#gridLi)" />
  <circle cx="380" cy="300" r="500" fill="url(#liGlow)" />

  <!-- LEFT COLUMN: Main Branding & Info -->
  <g transform="translate(80, 80)">
    <!-- Gemini Badge -->
    <g transform="translate(0, 0)">
      <rect width="360" height="40" rx="20" fill="url(#glassLi)" stroke="rgba(245, 158, 11, 0.35)" strokeWidth="1.2" />
      <circle cx="22" cy="20" r="7" fill="#f59e0b" />
      <circle cx="22" cy="20" r="12" fill="#f59e0b" opacity="0.25" />
      <text x="44" y="25" fill="#fbbf24" fontSize="14" fontWeight="800" class="font-sans" letterSpacing="2">
        POWERED BY GOOGLE GEMINI
      </text>
    </g>

    <!-- Brand Logo & Name -->
    <g transform="translate(0, 65)">
      <!-- Spark Icon -->
      <g transform="translate(0, 0)" filter="url(#shadowLi)">
        <rect width="72" height="72" rx="24" fill="url(#goldLi)" />
        <path d="M36 14 L52 38 L36 38 L40 58 L20 34 L33 34 Z" fill="#ffffff" />
      </g>

      <!-- Main Headline -->
      <text x="92" y="52" fill="#ffffff" fontSize="62" fontWeight="900" class="font-sans" letterSpacing="-1">
        SPARKMIND <tspan fill="url(#goldLi)">AI</tspan>
      </text>
    </g>

    <!-- Tagline -->
    <text x="0" y="180" fill="#94a3b8" fontSize="20" fontWeight="700" class="font-sans" letterSpacing="4">
      CHAT • CODE • LEARN • CREATE
    </text>

    <!-- Pitch Subtitle -->
    <text x="0" y="230" fill="#ffffff" fontSize="25" fontWeight="700" class="font-sans">
      The Next-Gen Multimodal Engineering &amp; Study Workspace
    </text>
    <text x="0" y="265" fill="#cbd5e1" fontSize="17" fontWeight="500" class="font-sans">
      5 Tailored Workspaces • Live Code Sandbox • Multilingual &amp; Telugu • ATS Resume Engine
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="36" rx="18" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" strokeWidth="1" />
        <text x="18" y="23" fill="#fbbf24" fontSize="13" fontWeight="bold" class="font-sans">⚡ 5 Workspaces</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" strokeWidth="1" />
        <text x="18" y="23" fill="#38bdf8" fontSize="13" fontWeight="bold" class="font-sans">💻 Code Sandbox</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(370, 0)">
        <rect width="180" height="36" rx="18" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.3)" strokeWidth="1" />
        <text x="18" y="23" fill="#f472b6" fontSize="13" fontWeight="bold" class="font-sans">🌍 Telugu &amp; Global</text>
      </g>
    </g>

    <!-- Author & License Box -->
    <g transform="translate(0, 410)" filter="url(#shadowLi)">
      <rect width="550" height="74" rx="22" fill="url(#glassLi)" stroke="rgba(255, 255, 255, 0.1)" strokeWidth="1" />
      <circle cx="42" cy="37" r="22" fill="url(#goldLi)" />
      <text x="42" y="44" textAnchor="middle" fill="#ffffff" fontSize="16" fontWeight="900" class="font-sans">KM</text>

      <text x="76" y="36" fill="#ffffff" fontSize="19" fontWeight="800" class="font-sans">
        Built by Komati Manoj Kumar
      </text>
      <text x="76" y="56" fill="#94a3b8" fontSize="13" fontWeight="600" class="font-sans">
        Lead Administrator, Author &amp; Project Owner • MIT Licensed
      </text>

      <rect x="430" y="22" width="100" height="30" rx="15" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" strokeWidth="1" />
      <text x="480" y="42" textAnchor="middle" fill="#fbbf24" fontSize="12" fontWeight="800" class="font-sans">MIT OPEN</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Stacked Glass UI Cards Showcase -->
  <g transform="translate(680, 80)">
    <!-- Showcase Card 1: Student Study Hub -->
    <g transform="translate(0, 0)" filter="url(#shadowLi)">
      <rect width="440" height="110" rx="22" fill="url(#glassLi)" stroke="rgba(245, 158, 11, 0.28)" strokeWidth="1.2" />
      <rect x="22" y="24" width="44" height="44" rx="14" fill="rgba(245, 158, 11, 0.15)" />
      <text x="34" y="54" fontSize="24">🎓</text>
      <text x="78" y="46" fill="#ffffff" fontSize="20" fontWeight="800" class="font-sans">Student Study Hub</text>
      <text x="78" y="74" fill="#94a3b8" fontSize="14" class="font-sans">10-Mark Exam Blueprints &amp; High-Yield Formulas</text>
    </g>

    <!-- Showcase Card 2: Developer Studio -->
    <g transform="translate(0, 130)" filter="url(#shadowLi)">
      <rect width="440" height="110" rx="22" fill="url(#glassLi)" stroke="rgba(56, 189, 248, 0.28)" strokeWidth="1.2" />
      <rect x="22" y="24" width="44" height="44" rx="14" fill="rgba(56, 189, 248, 0.15)" />
      <text x="34" y="54" fontSize="24">💻</text>
      <text x="78" y="46" fill="#ffffff" fontSize="20" fontWeight="800" class="font-sans">Developer Studio</text>
      <text x="78" y="74" fill="#94a3b8" fontSize="14" class="font-sans">In-Browser Code Execution (HTML/JS/Python)</text>
    </g>

    <!-- Showcase Card 3: Founder Launchpad -->
    <g transform="translate(0, 260)" filter="url(#shadowLi)">
      <rect width="440" height="110" rx="22" fill="url(#glassLi)" stroke="rgba(244, 63, 94, 0.28)" strokeWidth="1.2" />
      <rect x="22" y="24" width="44" height="44" rx="14" fill="rgba(244, 63, 94, 0.15)" />
      <text x="34" y="54" fontSize="24">🚀</text>
      <text x="78" y="46" fill="#ffffff" fontSize="20" fontWeight="800" class="font-sans">Founder Launchpad</text>
      <text x="78" y="74" fill="#94a3b8" fontSize="14" class="font-sans">Startup Pitch Decks &amp; 30-Day GTM Roadmaps</text>
    </g>

    <!-- Showcase Card 4: ATS Resume Intelligence -->
    <g transform="translate(0, 390)" filter="url(#shadowLi)">
      <rect width="440" height="110" rx="22" fill="url(#glassLi)" stroke="rgba(16, 185, 129, 0.28)" strokeWidth="1.2" />
      <rect x="22" y="24" width="44" height="44" rx="14" fill="rgba(16, 185, 129, 0.15)" />
      <text x="34" y="54" fontSize="24">📄</text>
      <text x="78" y="46" fill="#ffffff" fontSize="20" fontWeight="800" class="font-sans">ATS Resume Scanner</text>
      <text x="78" y="74" fill="#94a3b8" fontSize="14" class="font-sans">Real-Time Scoring &amp; Keyword Gap Optimizer</text>
    </g>
  </g>
</svg>
