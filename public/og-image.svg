<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a071b"/>
      <stop offset="50%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#1e0826"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep cinematic dark background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Radial Glow Orbs -->
  <circle cx="250" cy="300" r="220" fill="#8b5cf6" opacity="0.25" filter="url(#glow)"/>
  <circle cx="950" cy="250" r="200" fill="#f59e0b" opacity="0.2" filter="url(#glow)"/>
  <circle cx="600" cy="450" r="180" fill="#ec4899" opacity="0.2" filter="url(#glow)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Central Glass Card Frame -->
  <rect x="120" y="75" width="960" height="480" rx="32" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Logo Mark -->
  <g transform="translate(180, 140)">
    <rect width="90" height="90" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <path d="M45 15 C45 31.5 31.5 45 15 45 C31.5 45 45 58.5 45 75 C45 58.5 58.5 45 75 45 C58.5 45 45 31.5 45 15 Z" fill="url(#brandGrad)"/>
    <circle cx="45" cy="45" r="5" fill="#ffffff"/>
  </g>

  <!-- Brand Heading -->
  <text x="290" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1">
    SPARK<tspan fill="url(#subGrad)">MINDAI</tspan>
  </text>
  <rect x="660" y="158" width="160" height="34" rx="17" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1.2"/>
  <text x="740" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#fbbf24" letter-spacing="2" text-anchor="middle">
    AI WORKSPACE
  </text>

  <!-- Title / Tagline -->
  <text x="180" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="-0.5">
    Your Intelligent AI Workspace
  </text>

  <text x="180" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#cbd5e1">
    Powered by Google Gemini • Chat, Code, Study, Analyze &amp; Create
  </text>

  <!-- Feature Tags -->
  <g transform="translate(180, 395)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="80" y="26" fill="#f8fafc" text-anchor="middle">⚡ Fast Reasoning</text>

    <!-- Tag 2 -->
    <rect x="175" y="0" width="165" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="257" y="26" fill="#f8fafc" text-anchor="middle">💻 Code Architect</text>

    <!-- Tag 3 -->
    <rect x="355" y="0" width="160" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="435" y="26" fill="#f8fafc" text-anchor="middle">🎓 Study Helper</text>

    <!-- Tag 4 -->
    <rect x="530" y="0" width="175" height="42" rx="21" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
    <text x="617" y="26" fill="#f8fafc" text-anchor="middle">📄 Document Intel</text>
  </g>

  <!-- Domain URL Footer -->
  <text x="180" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#fbbf24">
    https://sparkmindai.netlify.app/
  </text>
</svg>
