<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#07090e" />
      <stop offset="45%" stopColor="#0f111a" />
      <stop offset="100%" stopColor="#05070b" />
    </linearGradient>

    <!-- Neon Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#fbbf24" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="radialGlow" cx="50%" cy="36%" r="55%">
      <stop offset="0%" stopColor="#fbbf24" stopOpacity="0.22" />
      <stop offset="50%" stopColor="#ea580c" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="rgba(255, 255, 255, 0.035)" strokeWidth="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(245, 158, 11, 0.15)" />
    </pattern>

    <!-- Glass Card Style -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stopColor="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="rgba(0,0,0,0.6)" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Background Layer -->
  <rect width="1080" height="1080" fill="url(#bg)" />
  <rect width="1080" height="1080" fill="url(#grid)" />
  <circle cx="540" cy="390" r="600" fill="url(#radialGlow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="180" r="180" fill="#f59e0b" opacity="0.05" filter="url(#shadow)" />
  <circle cx="920" cy="880" r="220" fill="#ea580c" opacity="0.06" filter="url(#shadow)" />

  <!-- Top Pill: Powered by Google Gemini -->
  <g transform="translate(340, 80)">
    <rect width="400" height="48" rx="24" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.35)" strokeWidth="1.5" />
    <circle cx="28" cy="24" r="8" fill="#f59e0b" />
    <circle cx="28" cy="24" r="14" fill="#f59e0b" opacity="0.25" />
    <text x="50" y="30" fill="#fbbf24" fontSize="16" fontWeight="800" class="font-sans" letterSpacing="2.5">
      POWERED BY GOOGLE GEMINI
    </text>
  </g>

  <!-- Central Logo Emblem -->
  <g transform="translate(480, 160)" filter="url(#shadow)">
    <rect width="120" height="120" rx="36" fill="url(#gold)" />
    <!-- Lightning Spark Icon -->
    <path d="M60 22 L86 64 L60 64 L66 98 L34 56 L56 56 Z" fill="#ffffff" />
  </g>

  <!-- Brand Typography -->
  <text x="540" y="340" textAnchor="middle" fill="#ffffff" fontSize="70" fontWeight="900" class="font-sans" letterSpacing="-1">
    SPARKMIND <tspan fill="url(#gold)">AI</tspan>
  </text>
  <text x="540" y="390" textAnchor="middle" fill="#94a3b8" fontSize="22" fontWeight="700" class="font-sans" letterSpacing="6">
    CHAT • CODE • LEARN • CREATE
  </text>

  <!-- 4 Bento Feature Cards -->
  <g transform="translate(80, 440)">
    <!-- Card 1: 5 Workspaces -->
    <g transform="translate(0, 0)">
      <rect width="440" height="120" rx="24" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.25)" strokeWidth="1.5" />
      <rect x="24" y="24" width="44" height="44" rx="14" fill="rgba(245, 158, 11, 0.15)" />
      <text x="36" y="54" fontSize="24">⚡</text>
      <text x="82" y="48" fill="#ffffff" fontSize="22" fontWeight="800" class="font-sans">5 AI Workspaces</text>
      <text x="82" y="76" fill="#94a3b8" fontSize="15" fontWeight="500" class="font-sans">Student, Dev, Founder &amp; Business</text>
    </g>

    <!-- Card 2: Live Code Sandbox -->
    <g transform="translate(480, 0)">
      <rect width="440" height="120" rx="24" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="24" width="44" height="44" rx="14" fill="rgba(56, 189, 248, 0.15)" />
      <text x="36" y="54" fontSize="24">💻</text>
      <text x="82" y="48" fill="#ffffff" fontSize="22" fontWeight="800" class="font-sans">Live Code Sandbox</text>
      <text x="82" y="76" fill="#94a3b8" fontSize="15" fontWeight="500" class="font-sans">Execute HTML, JS, Python Client-Side</text>
    </g>

    <!-- Card 3: Multilingual & Telugu AI -->
    <g transform="translate(0, 140)">
      <rect width="440" height="120" rx="24" fill="url(#cardGrad)" stroke="rgba(236, 72, 153, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="24" width="44" height="44" rx="14" fill="rgba(236, 72, 153, 0.15)" />
      <text x="36" y="54" fontSize="24">🌍</text>
      <text x="82" y="48" fill="#ffffff" fontSize="22" fontWeight="800" class="font-sans">Telugu &amp; Global AI</text>
      <text x="82" y="76" fill="#94a3b8" fontSize="15" fontWeight="500" class="font-sans">Native Script &amp; Conversational Tenglish</text>
    </g>

    <!-- Card 4: ATS Resume Intelligence -->
    <g transform="translate(480, 140)">
      <rect width="440" height="120" rx="24" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="24" width="44" height="44" rx="14" fill="rgba(16, 185, 129, 0.15)" />
      <text x="36" y="54" fontSize="24">📄</text>
      <text x="82" y="48" fill="#ffffff" fontSize="22" fontWeight="800" class="font-sans">ATS Resume Scanner</text>
      <text x="82" y="76" fill="#94a3b8" fontSize="15" fontWeight="500" class="font-sans">Score Matching &amp; Keyword Optimizer</text>
    </g>
  </g>

  <!-- Interactive Terminal/Chat Mockup -->
  <g transform="translate(80, 740)" filter="url(#shadow)">
    <rect width="920" height="160" rx="26" fill="rgba(0, 0, 0, 0.55)" stroke="rgba(245, 158, 11, 0.35)" strokeWidth="1.5" />
    <circle cx="42" cy="40" r="14" fill="url(#gold)" />
    <text x="70" y="46" fill="#ffffff" fontSize="18" fontWeight="800" class="font-sans">SparkMind Terminal Engine</text>
    <rect x="740" y="28" width="140" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" strokeWidth="1" />
    <text x="810" y="45" textAnchor="middle" fill="#34d399" fontSize="12" fontWeight="bold" class="font-sans">LIVE RUNNER</text>
    
    <text x="42" y="96" fill="#f1f5f9" fontSize="19" fontWeight="500" class="font-sans">
      &gt; "Optimized your algorithm, generated 10-mark exam notes, and built live UI preview."
    </text>
    <text x="42" y="130" fill="#94a3b8" fontSize="15" fontWeight="500" class="font-sans">
      ⚡ Google Search Grounding • Verified Citations • Zero Mock Fallbacks
    </text>
  </g>

  <!-- Bottom Signature Bar: Author & MIT License -->
  <g transform="translate(80, 935)">
    <rect width="920" height="76" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" strokeWidth="1" />
    <!-- Author Avatar Badge -->
    <circle cx="50" cy="38" r="22" fill="url(#gold)" />
    <text x="50" y="45" textAnchor="middle" fill="#ffffff" fontSize="16" fontWeight="900" class="font-sans">KM</text>

    <!-- Author Text -->
    <text x="86" y="44" fill="#ffffff" fontSize="22" fontWeight="800" class="font-sans">
      Built by Komati Manoj Kumar
    </text>
    <text x="440" y="44" fill="#64748b" fontSize="16" class="font-sans">|</text>
    <text x="455" y="44" fill="#94a3b8" fontSize="17" fontWeight="600" class="font-sans">
      Lead Administrator &amp; Project Owner
    </text>

    <!-- License Tag -->
    <rect x="780" y="22" width="115" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" strokeWidth="1" />
    <text x="837" y="43" textAnchor="middle" fill="#fbbf24" fontSize="14" fontWeight="800" class="font-sans">
      MIT LICENSE
    </text>
  </g>
</svg>
