<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgStory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#07090e" />
      <stop offset="40%" stopColor="#101322" />
      <stop offset="80%" stopColor="#0a0c16" />
      <stop offset="100%" stopColor="#05070a" />
    </linearGradient>

    <!-- Neon Gold Gradient -->
    <linearGradient id="goldStory" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#fbbf24" />
    </linearGradient>

    <!-- Radial Central Glow -->
    <radialGradient id="storyGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stopColor="#fbbf24" stopOpacity="0.25" />
      <stop offset="60%" stopColor="#ea580c" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Tech Grid -->
    <pattern id="storyGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.03)" strokeWidth="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(245, 158, 11, 0.2)" />
    </pattern>

    <!-- Glass Card -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stopColor="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="shadowStory" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="rgba(0,0,0,0.6)" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1080" height="1920" fill="url(#bgStory)" />
  <rect width="1080" height="1920" fill="url(#storyGrid)" />
  <circle cx="540" cy="560" r="700" fill="url(#storyGlow)" />

  <!-- Top Gemini Badge -->
  <g transform="translate(340, 140)">
    <rect width="400" height="52" rx="26" fill="url(#glassGrad)" stroke="rgba(245, 158, 11, 0.4)" strokeWidth="1.5" />
    <circle cx="30" cy="26" r="9" fill="#f59e0b" />
    <circle cx="30" cy="26" r="15" fill="#f59e0b" opacity="0.25" />
    <text x="56" y="33" fill="#fbbf24" fontSize="17" fontWeight="800" class="font-sans" letterSpacing="2.5">
      POWERED BY GOOGLE GEMINI
    </text>
  </g>

  <!-- Brand Spark Icon -->
  <g transform="translate(470, 240)" filter="url(#shadowStory)">
    <rect width="140" height="140" rx="42" fill="url(#goldStory)" />
    <path d="M70 26 L100 75 L70 75 L77 114 L40 65 L65 65 Z" fill="#ffffff" />
  </g>

  <!-- Header Typography -->
  <text x="540" y="445" textAnchor="middle" fill="#ffffff" fontSize="84" fontWeight="900" class="font-sans" letterSpacing="-1.5">
    SPARKMIND <tspan fill="url(#goldStory)">AI</tspan>
  </text>
  <text x="540" y="505" textAnchor="middle" fill="#94a3b8" fontSize="26" fontWeight="700" class="font-sans" letterSpacing="6">
    CHAT • CODE • LEARN • CREATE
  </text>

  <!-- Subheading -->
  <text x="540" y="565" textAnchor="middle" fill="#cbd5e1" fontSize="22" fontWeight="500" class="font-sans">
    The Next-Generation Multilingual AI Workspace
  </text>

  <!-- 5 Specialized Workspaces Bento Grid -->
  <g transform="translate(90, 630)">
    <!-- Section Title -->
    <text x="0" y="30" fill="#f8fafc" fontSize="26" fontWeight="800" class="font-sans">
      🚀 5 SPECIALIZED WORKSPACES
    </text>

    <!-- Card 1: Student Study Hub -->
    <g transform="translate(0, 50)">
      <rect width="900" height="110" rx="24" fill="url(#glassGrad)" stroke="rgba(245, 158, 11, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="22" width="66" height="66" rx="20" fill="rgba(245, 158, 11, 0.15)" />
      <text x="42" y="64" fontSize="30">🎓</text>
      <text x="110" y="48" fill="#ffffff" fontSize="24" fontWeight="800" class="font-sans">Student Study Hub</text>
      <text x="110" y="78" fill="#94a3b8" fontSize="17" class="font-sans">10-Mark Exam Answer Blueprints, Formulas &amp; MCQs</text>
    </g>

    <!-- Card 2: Developer Studio -->
    <g transform="translate(0, 180)">
      <rect width="900" height="110" rx="24" fill="url(#glassGrad)" stroke="rgba(56, 189, 248, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="22" width="66" height="66" rx="20" fill="rgba(56, 189, 248, 0.15)" />
      <text x="42" y="64" fontSize="30">💻</text>
      <text x="110" y="48" fill="#ffffff" fontSize="24" fontWeight="800" class="font-sans">Developer Studio</text>
      <text x="110" y="78" fill="#94a3b8" fontSize="17" class="font-sans">In-Browser Code Sandbox (HTML, JS, Python) &amp; Bug Fixing</text>
    </g>

    <!-- Card 3: Founder Launchpad -->
    <g transform="translate(0, 310)">
      <rect width="900" height="110" rx="24" fill="url(#glassGrad)" stroke="rgba(244, 63, 94, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="22" width="66" height="66" rx="20" fill="rgba(244, 63, 94, 0.15)" />
      <text x="42" y="64" fontSize="30">🚀</text>
      <text x="110" y="48" fill="#ffffff" fontSize="24" fontWeight="800" class="font-sans">Founder Launchpad</text>
      <text x="110" y="78" fill="#94a3b8" fontSize="17" class="font-sans">Startup Pitch Decks, ICP Discovery &amp; 30-Day Launch Checklists</text>
    </g>

    <!-- Card 4: Business Strategy -->
    <g transform="translate(0, 440)">
      <rect width="900" height="110" rx="24" fill="url(#glassGrad)" stroke="rgba(168, 85, 247, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="22" width="66" height="66" rx="20" fill="rgba(168, 85, 247, 0.15)" />
      <text x="42" y="64" fontSize="30">🏢</text>
      <text x="110" y="48" fill="#ffffff" fontSize="24" fontWeight="800" class="font-sans">Business Strategy Suite</text>
      <text x="110" y="78" fill="#94a3b8" fontSize="17" class="font-sans">Executive Proposals, Negotiation Playbooks &amp; SWOT Analysis</text>
    </g>

    <!-- Card 5: Telugu & Global AI -->
    <g transform="translate(0, 570)">
      <rect width="900" height="110" rx="24" fill="url(#glassGrad)" stroke="rgba(16, 185, 129, 0.3)" strokeWidth="1.5" />
      <rect x="24" y="22" width="66" height="66" rx="20" fill="rgba(16, 185, 129, 0.15)" />
      <text x="42" y="64" fontSize="30">🌍</text>
      <text x="110" y="48" fill="#ffffff" fontSize="24" fontWeight="800" class="font-sans">Telugu &amp; Multilingual AI</text>
      <text x="110" y="78" fill="#94a3b8" fontSize="17" class="font-sans">Native Telugu Script (తెలుగు) + Conversational Tenglish</text>
    </g>
  </g>

  <!-- Smartphone Live Chat Mockup -->
  <g transform="translate(90, 1360)" filter="url(#shadowStory)">
    <rect width="900" height="260" rx="32" fill="rgba(0, 0, 0, 0.55)" stroke="rgba(245, 158, 11, 0.35)" strokeWidth="1.5" />
    <circle cx="50" cy="50" r="18" fill="url(#goldStory)" />
    <text x="90" y="58" fill="#ffffff" fontSize="22" fontWeight="800" class="font-sans">SparkMind Assistant</text>
    <rect x="740" y="36" width="120" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)" stroke="rgba(16, 185, 129, 0.4)" strokeWidth="1" />
    <text x="800" y="55" textAnchor="middle" fill="#34d399" fontSize="13" fontWeight="bold" class="font-sans">GROUNDED</text>

    <text x="50" y="115" fill="#f8fafc" fontSize="22" fontWeight="500" class="font-sans">
      "Full stack TypeScript app generated with zero errors."
    </text>
    <text x="50" y="155" fill="#f8fafc" fontSize="22" fontWeight="500" class="font-sans">
      "Live preview mounted and ready to share across platforms!"
    </text>

    <g transform="translate(50, 195)">
      <rect width="210" height="34" rx="17" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" strokeWidth="1" />
      <text x="25" y="23" fill="#fbbf24" fontSize="15" fontWeight="bold" class="font-sans">⚡ Executed Sandbox</text>
    </g>
  </g>

  <!-- Author Signature Footer Card -->
  <g transform="translate(90, 1680)" filter="url(#shadowStory)">
    <rect width="900" height="150" rx="32" fill="url(#glassGrad)" stroke="rgba(245, 158, 11, 0.35)" strokeWidth="1.5" />
    
    <circle cx="75" cy="75" r="38" fill="url(#goldStory)" />
    <text x="75" y="85" textAnchor="middle" fill="#ffffff" fontSize="26" fontWeight="900" class="font-sans">KM</text>

    <text x="140" y="65" fill="#ffffff" fontSize="28" fontWeight="900" class="font-sans">
      Built by Komati Manoj Kumar
    </text>
    <text x="140" y="100" fill="#94a3b8" fontSize="20" fontWeight="600" class="font-sans">
      Lead Administrator &amp; Project Owner • MIT Licensed
    </text>

    <!-- Status Pill -->
    <rect x="730" y="55" width="130" height="40" rx="20" fill="rgba(245, 158, 11, 0.2)" stroke="rgba(245, 158, 11, 0.4)" strokeWidth="1" />
    <text x="795" y="80" textAnchor="middle" fill="#fbbf24" fontSize="15" fontWeight="bold" class="font-sans">
      OPEN SOURCE
    </text>
  </g>
</svg>
