    <script>
      (function() {
        try {
          var raw = localStorage.getItem('sparkmind_v1_active_user');
          var user = raw ? JSON.parse(raw) : null;
          var theme = user && user.theme ? user.theme : 'dark';
          // Always in Dark Mode except when user explicitly selected 'light' mode
          // (Dark mode is default even for System mode)
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }

        // Suppress benign Vite dev WebSocket disconnection errors in sandboxed preview
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (String(event.reason).indexOf('WebSocket') !== -1 || (event.reason.message && event.reason.message.indexOf('WebSocket') !== -1))) {
            event.preventDefault();
          }
        });
      })();
    </script>
